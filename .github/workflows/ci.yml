name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: psems
          POSTGRES_PASSWORD: psems_test_password
          POSTGRES_DB: psems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psems -d psems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 4000
      DATABASE_URL: postgresql://psems:psems_test_password@localhost:5432/psems_test
      DIRECT_URL: postgresql://psems:psems_test_password@localhost:5432/psems_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_test_access_secret_do_not_use_in_prod
      JWT_REFRESH_SECRET: ci_test_refresh_secret_do_not_use_in_prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test
